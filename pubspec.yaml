name: bakugan_companion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  video_player: ^2.8.1
  fvp: ^0.38.1
  audioplayers: ^6.8.1
  flutter_svg: ^2.0.10+1
  flutter_3d_controller: ^2.3.0
  flutter_inappwebview: ^6.1.5
  auto_size_text: ^3.0.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  fonts:
    - family: title_font
      fonts:
        - asset: assets/font/titles_font.otf
          weight: 700
    - family: body_font
      fonts:
        - asset: assets/font/body_font.ttf
          weight: 700
    - family: button_font
      fonts:
        - asset: assets/font/button_font.ttf

